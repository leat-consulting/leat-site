name: pr

on:
  pull_request:

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    uses: leat-consulting/platform-workflows/.github/workflows/node-ci.yml@1580c16870f66b71da005ccf146c2eaf8fb91c20 # v1.0.0
    permissions:
      contents: read

  scan:
    name: scan
    uses: leat-consulting/platform-workflows/.github/workflows/security-scan.yml@1580c16870f66b71da005ccf146c2eaf8fb91c20 # v1.0.0
    permissions:
      contents: read

  lighthouse:
    name: lighthouse
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Lighthouse (median of three, target 95)
        run: npm run lighthouse
