<!doctype html>
<!-- Template for public/og-default.png, the image shown when a page is shared.
     Render at 1200x630 with a headless browser after npm ci, for example:
     chrome --headless=new --screenshot=public/og-default.png --window-size=1200,630 file://$PWD/scripts/og-image.html -->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Inter; src: url("../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0d1411; color: #e6ece8; font-family: Inter, sans-serif; display: flex; flex-direction: column; justify-content: center; padding: 0 96px; box-sizing: border-box; }
  .wordmark { align-self: flex-start; display: inline-block; position: relative; padding-bottom: 0.3em; font-weight: 760; font-size: 150px; line-height: 1; letter-spacing: -0.06em; }
  .wordmark svg { position: absolute; left: 0.02em; bottom: 0; width: calc(100% - 0.02em); height: auto; overflow: visible; }
  p { font-size: 44px; font-weight: 600; letter-spacing: -0.02em; margin: 48px 0 0; max-width: 22em; line-height: 1.2; }
  .sub { font-size: 26px; font-weight: 500; color: #a5b3ab; margin-top: 20px; letter-spacing: 0; max-width: none; }
</style>
</head>
<body>
  <div class="wordmark">leat<svg viewBox="0 0 102 16"><path d="M6 8H96" stroke="#6fd3a8" stroke-width="2.2"/><circle cx="6" cy="8" r="4.2" fill="#0d1411" stroke="#6fd3a8" stroke-width="2.2"/><circle cx="36" cy="8" r="4.2" fill="#0d1411" stroke="#6fd3a8" stroke-width="2.2"/><circle cx="66" cy="8" r="4.2" fill="#0d1411" stroke="#6fd3a8" stroke-width="2.2"/><circle cx="96" cy="8" r="5.6" fill="#6fd3a8"/></svg></div>
  <p>From laptop to production, done properly.</p>
  <p class="sub">Leat Consulting · UK-based platform engineering on GitHub, GitLab and AWS</p>
</body>
</html>
